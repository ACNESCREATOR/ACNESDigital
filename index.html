<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- ETIQUETAS SEO -->
    <title>ACNES Digital | Próximamente</title>
    <meta name="description" content="Estamos desarrollando herramientas digitales e infraestructura interactiva para optimizar tus proyectos. Muy pronto en línea.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://acnespublicidad.com/FAVIACNES.png">
    <link rel="apple-touch-icon" href="https://acnespublicidad.com/FAVIACNES.png">

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050505;
            --bg-card: rgba(15, 15, 15, 0.7);
            --border-tech: rgba(255, 255, 255, 0.08);
            --accent-tech: #00fff7;
            --text-main: #ffffff;
            --text-muted: #999999;
        }

        /* ESTILOS BASE */
        html, body {
            margin: 0; padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Roboto', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            -webkit-user-select: none;
            user-select: none;
        }

        /* EFECTO VIDRIO / VINIL ESMERILADO DE FONDO */
        .frosted-glass-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
            background-color: #030303;
        }

        .glow-light {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            animation: moveGlow 12s infinite alternate ease-in-out;
        }
        .glow-1 {
            width: 400px; height: 400px;
            background: #00fff7; 
            top: -10%; left: -10%;
            animation-duration: 14s;
        }
        .glow-2 {
            width: 500px; height: 500px;
            background: #0761b5; 
            bottom: -15%; right: -10%;
            animation-duration: 18s;
            animation-delay: -3s;
        }
        .glow-3 {
            width: 350px; height: 350px;
            background: #8A2BE2; 
            top: 40%; left: 30%;
            animation-duration: 10s;
            animation-delay: -5s;
            opacity: 0.2;
        }

        @keyframes moveGlow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(60px, 40px) scale(1.15); }
            100% { transform: translate(-40px, -50px) scale(0.9); }
        }

        .frosted-texture {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            background: rgba(5, 5, 5, 0.45); 
            z-index: 2;
        }

        /* CONTENEDOR PRINCIPAL TARJETA */
        .construction-card {
            position: relative;
            z-index: 10;
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-tech);
            padding: 50px 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 520px;
            width: 90%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 247, 0.05);
            box-sizing: border-box;
        }

        .logo-acnes {
            height: 45px;
            filter: brightness(0) invert(1);
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 0 0 15px 0;
            color: var(--text-main);
        }

        h1 span {
            color: var(--accent-tech);
        }

        p {
            font-size: 1rem;
            color: #cccccc;
            line-height: 1.6;
            font-weight: 300;
            margin-bottom: 30px;
        }

        /* PUNTITO PARPADEANTE */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 255, 247, 0.05);
            border: 1px solid rgba(0, 255, 247, 0.2);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-tech);
            margin-bottom: 25px;
        }

        .badge-dot {
            width: 7px;
            height: 7px;
            background-color: var(--accent-tech);
            border-radius: 50%;
            animation: pulsarPunto 1.5s infinite ease-in-out;
            box-shadow: 0 0 8px rgba(0, 255, 247, 0.8);
        }

        @keyframes pulsarPunto {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        .btn-contacto {
            display: inline-block;
            background-color: var(--accent-tech);
            color: #000;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 4px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 247, 0.25);
        }

        .btn-contacto:hover {
            background-color: #fff;
            box-shadow: 0 0 30px rgba(0, 255, 247, 0.6);
            transform: translateY(-2px);
        }

        .footer-note {
            margin-top: 25px;
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>
<body>

    <!-- FONDO DE VIDRIO / VINIL ESMERILADO -->
    <div class="frosted-glass-bg">
        <div class="glow-light glow-1"></div>
        <div class="glow-light glow-2"></div>
        <div class="glow-light glow-3"></div>
        <div class="frosted-texture"></div>
    </div>

    <!-- TARJETA CENTRAL -->
    <div class="construction-card">
        
        
        <div class="status-badge">
            <div class="badge-dot"></div>
            Sistema en desarrollo
        </div>

        <h1>Plataforma <span>Digital</span></h1>
        
        <p>Estamos construyendo el nuevo centro de ingeniería y herramientas interactivas. Muy pronto habilitaremos los cotizadores y simuladores en este dominio.</p>

        <a href="https://wa.me/525521913826?text=Hola,%20vengo%20de%20acnesdigital.com%20y%20quiero%20información" class="btn-contacto" target="_blank" rel="noopener noreferrer">Contactar vía WhatsApp</a>

        <div class="footer-note">
            ACNES Digital © 2026
        </div>
    </div>

</body>
</html>
