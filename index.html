<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACNES Digital</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://acnespublicidad.com/FAVIACNES.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050505;
            --accent-tech: #00fff7;
        }

        body, html {
            margin: 0; 
            padding: 0;
            width: 100%; 
            height: 100%;
            background-color: var(--bg-deep);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Montserrat', sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        /* =========================================
           FONDO DE VIDRIO ESMERILADO Y LUCES
           ========================================= */
        .frosted-glass-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 1;
            pointer-events: none;
        }
        
        .glow-light {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            animation: moveGlow 15s infinite alternate ease-in-out;
        }
        
        .glow-1 { width: 500px; height: 500px; background: #00fff7; top: -10%; left: -10%; }
        .glow-2 { width: 450px; height: 450px; background: #0761b5; bottom: -10%; right: -5%; animation-delay: -5s; }
        
        @keyframes moveGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(80px, 50px) scale(1.1); }
        }

        .frosted-texture {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            background: rgba(5, 5, 5, 0.6); 
            z-index: 2;
        }

        /* =========================================
           CONTENEDOR CENTRAL: LOGO + CARGADOR
           ========================================= */
        .center-hub {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 250px;
            height: 250px;
        }

        /* LOGO CON LIGERO PULSO */
        .logo-center {
            width: 140px; /* Ajusta este tamaño si el logo se ve muy grande o pequeño */
            height: auto;
            z-index: 15;
            animation: pulseLogo 3s infinite ease-in-out;
            /* Si tu logo ya tiene color y no quieres que se ponga blanco, borra la línea de abajo */
            filter: brightness(0) invert(1); 
        }

        @keyframes pulseLogo {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* ARO CARGADOR CYAN ROTANDO */
        .loader-ring {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 50%;
            border: 2px solid rgba(0, 255, 247, 0.05);
            border-top: 3px solid var(--accent-tech);
            border-right: 3px solid var(--accent-tech);
            box-shadow: 0 0 25px rgba(0, 255, 247, 0.4), inset 0 0 15px rgba(0, 255, 247, 0.1);
            animation: spinRing 1.5s linear infinite;
            z-index: 10;
        }

        /* ARO SECUNDARIO (Rotando en sentido contrario para más estilo) */
        .loader-ring-inner {
            position: absolute;
            top: 15px; left: 15px; right: 15px; bottom: 15px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-bottom: 2px solid #ffffff;
            animation: spinRingReverse 2.5s linear infinite;
            z-index: 9;
            opacity: 0.5;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes spinRingReverse {
            0% { transform: rotate(360deg); }
            100% { transform: rotate(0deg); }
        }

    </style>
</head>
<body>

    <!-- FONDO TECNOLÓGICO -->
    <div class="frosted-glass-bg">
        <div class="glow-light glow-1"></div>
        <div class="glow-light glow-2"></div>
        <div class="frosted-texture"></div>
    </div>

    <!-- CENTRO: LOGO Y CARGADOR -->
    <div class="center-hub">
        <div class="loader-ring"></div>
        <div class="loader-ring-inner"></div>
        <img src="https://acnesdigital.com/imagenes/ACDIGI.png" alt="ACNES Digital" class="logo-center">
    </div>

    <!-- PROTECCIÓN -->
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if(e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
